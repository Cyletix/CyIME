# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.ai_translate

# 插件名称与描述
name: AI 翻译
icon: "译"
description: 翻译选中文本/输入框内容，结果替换原选区或光标处追加。支持任意 OpenAI 兼容接口。

# 插件版本
version: 0.2.0

# 插件分类：tool 工具类（多开）
type: tool
activation: multi

# 入口脚本
entry: main.lua

# 宿主最低版本要求
minHostVersion: 2.6.2

# 工具栏入口
toolbarButtons:
  - id: com.kingzcheung.xime.plugin.ai_translate:open
    label: AI 翻译
    action: open_panel

# 网络访问：接受用户自定义服务器地址
network:
  allowCustomHosts: true

# 配置字段
configSchema:
  - key: apiKey
    label: API Key
    type: secret
    placeholder: 输入 LLM API Key
    helpText: OpenAI 兼容接口的 API Key
  - key: baseUrl
    label: 接口地址
    type: text
    defaultValue: https://api.openai.com/v1
    helpText: OpenAI 兼容接口地址（/chat/completions 前缀），域名将自动获得联网授权
  - key: model
    label: 模型
    type: text
    defaultValue: gpt-4o-mini
  - key: targetLang
    label: 目标语言
    type: text
    defaultValue: 简体中文
    helpText: 翻译目标语言（如 简体中文 / English / 日本語）
  - key: prompt
    label: 翻译模板
    type: textarea
    defaultValue: "你是专业翻译。请把下面的内容翻译成{targetLang}，只输出译文，不要解释、不要引号。\n{context}"
    helpText: 翻译 prompt 模板，{context} 替换为待翻译文本，{targetLang} 替换为目标语言
# 能力声明
capabilities:
  tool:
    display: direct
