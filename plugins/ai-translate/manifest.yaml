# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.ai_translate

# 插件名称与描述
name: AI 翻译
icon: "译"
description: 翻译选中文本/输入框内容，结果替换原选区或光标处追加。支持任意 OpenAI 兼容接口。

# 插件版本
version: 0.2.0

# 插件分类：tool 工具类（多开）
type: tool
activation: multi

# 入口脚本
entry: main.lua

# 宿主最低版本要求
minHostVersion: 2.6.2

# 工具栏入口
toolbarButtons:
  - id: com.kingzcheung.xime.plugin.ai_translate:open
    label: AI 翻译
    action: open_panel

# 网络访问：接受用户自定义服务器地址
network:
  allowCustomHosts: true

# 能力声明
# 能力声明
capabilities:
  tool:
    display: direct
