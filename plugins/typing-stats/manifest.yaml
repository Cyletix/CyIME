# =============================================
# 输入统计插件（演示下行事件：input_changed / text_committed）
# =============================================

id: com.kingzcheung.xime.plugin.typing_stats

name: 输入统计
icon: "统"
description: 统计打字量（今日/累计字数、提交次数）。基于宿主下行事件，无网络访问。

# 0.3.1：按分类累计快照恢复统计，不依赖逐条文本事件；要求 CyIME 1.2.9。
version: 0.3.1

type: tool
activation: multi

entry: main.lua

minHostVersion: 1.2.9

# 工具栏入口
toolbarButtons:
  - id: com.kingzcheung.xime.plugin.typing_stats:open
    label: 输入统计
    action: open_panel

# 无 network 声明：本插件不联网

# 能力声明：订阅下行事件（宿主仅对声明了事件的插件建立投递通道）
capabilities:
  tool:
    display: passive
  events:
    - input_changed
    - typing_totals
