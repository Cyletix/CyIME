# =============================================
# CyIME Lua 插件元数据（宿主用 YAML 解析）
# =============================================

id: com.kingzcheung.xime.plugin.ai_rewrite

name: AI 改写
icon: "改"
description: 选中一段字（不选就是整个输入框），点键盘菜单里的「AI 改写」，选润色、改错字、更正式、更口语、缩短或翻译，点结果替换原文。用你自己的 OpenAI 兼容接口，密钥只存在手机里。

version: 0.3.2

type: tool
activation: multi

entry: main.lua

minHostVersion: 1.15.38

toolbarButtons:
  - id: com.kingzcheung.xime.plugin.ai_rewrite:open
    label: AI 改写
    action: open_panel

# 接口地址由用户填写，域名在第一次使用时授权
network:
  allowCustomHosts: true

capabilities:
  tool:
    # passive：面板里显示原文、动作按钮和结果，点结果才替换
    display: passive
    # field：没选字时取整个输入框，点结果替换整框（不拿剪贴板）
    context: field
