# =============================================
# CyIME Lua 插件元数据（宿主用 YAML 解析）
# =============================================

id: com.kingzcheung.xime.plugin.online_asr

name: 在线语音
icon: "🎙️"
description: 用你自己的语音转写接口识别说话（OpenAI 兼容 /audio/transcriptions，如 OpenAI、Groq、硅基流动；也支持腾讯 TokenHub 同步语音识别）。说完一句整段上传；失败时这次自动改用本地模型。密钥只存在手机里。

version: 0.1.1

type: speech
activation: single

entry: main.lua

minHostVersion: 1.15.38

capabilities:
  speech:
    # batch：录完整段上传，说话中没有预览；失败时宿主用本地模型重识别这段录音
    inputMode: batch
    supportsPartialResults: false
    # 接口返回的文字自带标点，跟随「自动加标点」和逐项开关
    keepsPunctuation: true
    # 接口自己认语言：中文、英文、日语都交给它
    languages: any

# 接口地址由用户填写，设置页点「保存」时授权
network:
  allowCustomHosts: true
