# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.ai_write

# 插件名称与描述
name: AI 帮写
icon: "帮"
description: 输入草稿/指令，SSE 流式生成长文本，打字机效果上屏。支持任意 OpenAI 兼容接口。

# 插件版本
version: 0.2.0

# 插件分类：tool 工具类（多开）
type: tool
activation: multi

# 入口脚本
entry: main.lua

# 宿主最低版本要求（工具栏按钮 + 工具面板契约 + SSE 流式原语）
minHostVersion: 2.6.2

# 工具栏入口
toolbarButtons:
  - id: com.kingzcheung.xime.plugin.ai_write:open
    label: AI 帮写
    action: open_panel

# 网络访问：接受用户自定义服务器地址
network:
  allowCustomHosts: true

# 配置字段
configSchema:
  - key: apiKey
    label: API Key
    type: secret
    placeholder: 输入 LLM API Key
    helpText: OpenAI 兼容接口的 API Key
  - key: baseUrl
    label: 接口地址
    type: text
    defaultValue: https://api.openai.com/v1
    helpText: OpenAI 兼容接口地址（/chat/completions 前缀），域名将自动获得联网授权
  - key: model
    label: 模型
    type: text
    defaultValue: gpt-4o-mini
  - key: prompt
    label: 写作模板
    type: textarea
    defaultValue: "你是我的写作助手。请根据以下上下文与要求写一段通顺的中文文字：\n{context}"
    helpText: 写作 prompt 模板，{context} 会被替换为面板输入内容
# 能力声明
capabilities:
  tool:
    display: direct
