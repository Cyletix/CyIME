# Rime schema
# 小写编码为精确字母，大写代表合并键；逐位派生支持点击与滑动混合输入。
schema:
  schema_id: pinyin_14jian
  name: 中文14键
  version: "1.2"
  dependencies:
    - cyime_k14_english
  description: |
    拼音 14 键方案，字母两两合并（qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m），
    键宽更大误触更少，与九键同为词库消歧。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - t9_english_translator@k14_english
    - lua_translator@*uuid
  # 与 26 键、九键同一套候选规则：长按删掉的候选不再出现、同字候选去重（cyime_candidate_policy），再去重一次。
  filters:
    - cyime_candidate_policy
    - simplifier@traditionalize
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaQETUOADGJZCB
  delimiter: " '"
  algebra:
    # 词库里的单个大写字母音节（A–Z，供 26 键直接打出字母）与合并键的大写编码同形，
    # 会被当成完整拼写，使同一输入里的简拼全部被剪掉（zdky 只出 ZDJT）。14 键用不到它们。
    - erase/^[A-Z]$/
    # 简拼与容错规则（与 pinyin_simp 一致）
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    # 不派生 ju/qu/xu/yu 的 v 写法：14 键上 v 和 c 同键，QC 会被读成“去”，C 就当不了声母（JQC 出不来讲清楚）。
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 每一位可独立为精确字母或合并键，不将精确字母重新映射成歧义编码。
    - derive/^(.{0})[qw](.*)$/$1Q$2/
    - derive/^(.{0})[er](.*)$/$1E$2/
    - derive/^(.{0})[ty](.*)$/$1T$2/
    - derive/^(.{0})[ui](.*)$/$1U$2/
    - derive/^(.{0})[op](.*)$/$1O$2/
    - derive/^(.{0})[as](.*)$/$1A$2/
    - derive/^(.{0})[df](.*)$/$1D$2/
    - derive/^(.{0})[gh](.*)$/$1G$2/
    - derive/^(.{0})[jk](.*)$/$1J$2/
    - derive/^(.{0})[zx](.*)$/$1Z$2/
    - derive/^(.{0})[cv](.*)$/$1C$2/
    - derive/^(.{0})[bn](.*)$/$1B$2/
    - derive/^(.{1})[qw](.*)$/$1Q$2/
    - derive/^(.{1})[er](.*)$/$1E$2/
    - derive/^(.{1})[ty](.*)$/$1T$2/
    - derive/^(.{1})[ui](.*)$/$1U$2/
    - derive/^(.{1})[op](.*)$/$1O$2/
    - derive/^(.{1})[as](.*)$/$1A$2/
    - derive/^(.{1})[df](.*)$/$1D$2/
    - derive/^(.{1})[gh](.*)$/$1G$2/
    - derive/^(.{1})[jk](.*)$/$1J$2/
    - derive/^(.{1})[zx](.*)$/$1Z$2/
    - derive/^(.{1})[cv](.*)$/$1C$2/
    - derive/^(.{1})[bn](.*)$/$1B$2/
    - derive/^(.{2})[qw](.*)$/$1Q$2/
    - derive/^(.{2})[er](.*)$/$1E$2/
    - derive/^(.{2})[ty](.*)$/$1T$2/
    - derive/^(.{2})[ui](.*)$/$1U$2/
    - derive/^(.{2})[op](.*)$/$1O$2/
    - derive/^(.{2})[as](.*)$/$1A$2/
    - derive/^(.{2})[df](.*)$/$1D$2/
    - derive/^(.{2})[gh](.*)$/$1G$2/
    - derive/^(.{2})[jk](.*)$/$1J$2/
    - derive/^(.{2})[zx](.*)$/$1Z$2/
    - derive/^(.{2})[cv](.*)$/$1C$2/
    - derive/^(.{2})[bn](.*)$/$1B$2/
    - derive/^(.{3})[qw](.*)$/$1Q$2/
    - derive/^(.{3})[er](.*)$/$1E$2/
    - derive/^(.{3})[ty](.*)$/$1T$2/
    - derive/^(.{3})[ui](.*)$/$1U$2/
    - derive/^(.{3})[op](.*)$/$1O$2/
    - derive/^(.{3})[as](.*)$/$1A$2/
    - derive/^(.{3})[df](.*)$/$1D$2/
    - derive/^(.{3})[gh](.*)$/$1G$2/
    - derive/^(.{3})[jk](.*)$/$1J$2/
    - derive/^(.{3})[zx](.*)$/$1Z$2/
    - derive/^(.{3})[cv](.*)$/$1C$2/
    - derive/^(.{3})[bn](.*)$/$1B$2/
    - derive/^(.{4})[qw](.*)$/$1Q$2/
    - derive/^(.{4})[er](.*)$/$1E$2/
    - derive/^(.{4})[ty](.*)$/$1T$2/
    - derive/^(.{4})[ui](.*)$/$1U$2/
    - derive/^(.{4})[op](.*)$/$1O$2/
    - derive/^(.{4})[as](.*)$/$1A$2/
    - derive/^(.{4})[df](.*)$/$1D$2/
    - derive/^(.{4})[gh](.*)$/$1G$2/
    - derive/^(.{4})[jk](.*)$/$1J$2/
    - derive/^(.{4})[zx](.*)$/$1Z$2/
    - derive/^(.{4})[cv](.*)$/$1C$2/
    - derive/^(.{4})[bn](.*)$/$1B$2/
    - derive/^(.{5})[qw](.*)$/$1Q$2/
    - derive/^(.{5})[er](.*)$/$1E$2/
    - derive/^(.{5})[ty](.*)$/$1T$2/
    - derive/^(.{5})[ui](.*)$/$1U$2/
    - derive/^(.{5})[op](.*)$/$1O$2/
    - derive/^(.{5})[as](.*)$/$1A$2/
    - derive/^(.{5})[df](.*)$/$1D$2/
    - derive/^(.{5})[gh](.*)$/$1G$2/
    - derive/^(.{5})[jk](.*)$/$1J$2/
    - derive/^(.{5})[zx](.*)$/$1Z$2/
    - derive/^(.{5})[cv](.*)$/$1C$2/
    - derive/^(.{5})[bn](.*)$/$1B$2/
    - derive/^(.{6})[qw](.*)$/$1Q$2/
    - derive/^(.{6})[er](.*)$/$1E$2/
    - derive/^(.{6})[ty](.*)$/$1T$2/
    - derive/^(.{6})[ui](.*)$/$1U$2/
    - derive/^(.{6})[op](.*)$/$1O$2/
    - derive/^(.{6})[as](.*)$/$1A$2/
    - derive/^(.{6})[df](.*)$/$1D$2/
    - derive/^(.{6})[gh](.*)$/$1G$2/
    - derive/^(.{6})[jk](.*)$/$1J$2/
    - derive/^(.{6})[zx](.*)$/$1Z$2/
    - derive/^(.{6})[cv](.*)$/$1C$2/
    - derive/^(.{6})[bn](.*)$/$1B$2/

translator:
  dictionary: rime_ice
  prism: pinyin_14jian
  # 整句规则同 26 键（tasks-chinese.gradle.kts 由 app/data/sentence_final_particles.txt、sentence_measure_words.txt
  # 生成的那几行）：每个音节留 4 个单字同音备选，合并键读音多时“已”这类字才进得了整句（woyijiancha 出 我已检查）；
  # 语气词、量词不当句首，把/被不当句末。
  sentence_char_homophones: 4
  sentence_position_penalty: -2.0
  sentence_position_final_only: [吧, 呗, 呢, 吗, 啊, 嘛, 啦, 呀, 哦, 咯, 哟, 哇, 嘞, 喽, 个, 只, 条, 张, 件, 位, 块]
  sentence_position_initial_only: [把, 被]
  # 四条整句备选，由词组模型挑最自然的一条放第一（菜单仍只显示一条），同 26 键（t9/sentence_rescore）。
  max_sentences: 4
  sentence_cutoff_threshold: 100
  packs:
    - user_simp
  spelling_hints: 8
  preedit_format:
    - xlit/QETUOADGJZCB/qetuoadgjzcb/
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

menu:
  page_size: 5

punctuator:
  import_preset: default
  __include: symbols:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"

# 词组模型给 Rime 的四条整句重新打分（同 26 键；2026-10-20 电脑回归：整句首选 调参 LCCC 299→365、SMS 324→387，
# 各列不变差，逐键 p95 约 +1.5%）。没有 t9_ngram.lm 时照原样只出一条。14 键不传前文，第一个词不按句首算。
t9:
  sentence_rescore: true
  ngram_model: t9_ngram
  ngram_sentence_start: false

# 英文词（同九键英文词表，按 14 键合并键编码）：整词排在中文后，按到第 4 个键起再给出最多 3 个开头相符的词。
k14_english:
  dictionary: cyime_k14_english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: -1
  comment_format: []
  completion_limit: 3
  completion_keys: "QETUOADGJZCBlm"

# 简/繁（设置 → 语言与方案 → 繁体输出）：与 26 键同一张台湾正体转换表，见 opencc/cyime_s2tw.json。
traditionalize:
  option_name: traditionalization
  opencc_config: cyime_s2tw.json
  tips: none
