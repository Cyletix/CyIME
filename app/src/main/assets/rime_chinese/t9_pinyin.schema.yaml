# Rime schema
# encoding: utf-8
# T9 拼音九键（与 pinyin_simp 共享字典）
# 参考雾凇拼音方案：数字序列直接由 RIME speller algebra 展开，
# 引擎原生处理数字→拼音转换和多音节歧义消解。
# 左侧候选区由 T9PinyinMap librime-t9 计算展示。
t9:
  joint_decoder: true
  source_budget: 128
  pool_budget: 64
  dictionary_beam: 16
  sentence_beam: 24
  result_budget: 12
  # 整串的组句结果显示前几条（最多 display_sentences 条），后面接较短的词；0 为全部显示。
  display_sentences: 1
  # 改为 3 时，第 2、3 条整句只在 9 个键以上显示（短输入的备选整句会把“的”“觉得”挤出前四）。
  # 2026-10-18 回放：长句目标进前五 85%→92%、首选不变，但连续打字逐键平均耗时 +1 ms 超出噪声带，
  # 未过速度门禁，暂不开启（pinyin26-word-model-20261018.md）。
  more_sentences_min_keys: 9
  spelling_penalty: 5.0
  word_penalty: 8.0
  # 停顿后的长句模型重排已停用（2026-10-09 同语料回放：停顿后首选只多对 3/488 字，
  # 同时拖慢逐键解码并在停顿后改动候选）。排序只依据词权与语法 n-gram；
  # 恢复时在此加回 sentence_model: t9_sentence，并重跑九键回放与速度门禁。
  sentence_weight: 0.25
  # 词组模型（tools/ime_lab/ngram）：存在 t9_ngram.lm 时，组句每个词的分数统一为
  # ln P(词 | 前面的词)，取代词库权重、语法搭配与每词扣分；文件不存在时保持原算法。
  ngram_model: t9_ngram
  # 第一个词按“出现在句首的概率”打分，而不是总体词频（如“着”“么”很常见但几乎不在句首）。
  ngram_sentence_start: true
  # 句尾概率强度：整句排序时加上“在这里结束”的概率；打字途中不一定是句尾，强度由调参集确定，0 为不用。
  ngram_eos_weight: 0
  # 用户学习层占比 λ：词分数 = ln((1-λ)·P底座 + λ·P用户)，P用户取用户词库的上屏占比（近期选过的更高）；底座模型不被改写，0 为不学习。
  ngram_user_weight: 0.05
  # 词库先验 μ：语料里没见过的词库词（细胞词库、生僻词）按 ln((1-μ)·P拆字 + μ·P词库频率) 计分，
  # 让“无精二”这类词首次也能排上；0 为不用。取值由调参集回放确定。
  ngram_dictionary_prior: 0.02
  # 同一串字有多种分词时（如“那你还”与“那你／还”），整串的概率是各种分词之和；false 时只取最好的一种。
  ngram_merge_segmentations: false
  # 少见读音扣分（cyime_readings.txt，构建时由词库生成）：词组模型只给字词打分，不分读音，
  # 所以“的”按 di（目的）读也照样高分，打 momodi 出“默默的”而不是“默默地”。这里按词库里各读音的频率比扣分。
  reading_table: cyime_readings
  # 适应元书输入法的配置，是否显示 rime 中原始的预编辑文本，默认为 true
  # true: 对 preedit 不做处理，显示 rime 返回的原始 preedit 值。
  #       如果想通过 lua 自己调整 preedit 的显示，可以设置为 true。
  # false: 根据候选字 comment 显示转换后的 preedit 内容。
  #        注意：请务必保证候选字 comment 有效且正确，否则可能导致预编辑文本显示异常。
  isDisplayOriginalPreedit: false

  # 日期翻译器开关（true=开启，false=关闭） 参考白霜实现，感谢白霜方案
  enable_date_translator: true

  # 超越输入序列长度，借助简拼匹配长词召回开关（true=开启，false=关闭）
  # 通过补丁注入 derive 简拼，让"几乎把/几乎从"等简拼长词能被 RIME 原生召回。
  # 默认开启；关闭后简拼匹配长词不召回（仅完整拼音词、单字）。
  enable_abbrev_recall: true

  # 日期翻译器触发词配置 参考白霜实现，感谢白霜方案
  date_translator:
    date: riqi
    time: sj
    week: xq
    datetime: dt
    timestamp: ts
    lunar: nl
    # 候选插入位置（默认 2，即第二位）
    idx: 2

schema:
  schema_id: t9_pinyin
  dependencies:
    - cyime_t9_english
  name: 中文九键
  version: "2.2"
  description: |
    拼音九键方案，使用 ABC/DEF/GHI/JKL/MNO/PQRS/TUV/WXYZ 键位

# 开关
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - t9_processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - t9_date_translator
    - punct_translator
    - script_translator
    - t9_english_translator@t9_english
  filters:
    - cyime_candidate_policy
    - t9_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba9876543210
  initials: zyxwvutsrqponmlkjihgfedcba9876543210
  delimiter: " '"
  algebra:
    # 简拼规则
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 拼音容错规则
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - fuzz/un$/uen/
    - fuzz/ui$/uei/
    - fuzz/iu$/iou/
    - fuzz/([aeiou])ng$/$1gn/
    # T9 keys already encode letter ambiguity; do not treat sho (746) as shou (7468).
    - fuzz/ong$/on/
    - fuzz/ao$/oa/
    - fuzz/([iu])a(o|ng?)$/a$1$2/
    # 九宫格数字映射（derive 创建双向映射：数字↔字母）
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[hgi]/4/
    - derive/[jkl]/5/
    - derive/[omn]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/

translator:
  dictionary: rime_ice
  max_homophones: 32
  max_sentences: 3
  prism: t9_pinyin
  spelling_hints: 100
  always_show_comments: true
  comment_format: []
  preedit_format:
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

cyime:
  candidate_policy: true

# amzxyz/RIME-LMDG, CC-BY-4.0. The build pins and verifies the bundled model.
grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

punctuator:
  import_preset: default

recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"

key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }

editor:
  bindings:
    space: confirm

# Whole English words from the bundled melt_eng sources, indexed by T9 digits.
# Native table candidates retain their original casing and global selection index.
t9_english:
  dictionary: cyime_t9_english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: true
  initial_quality: 0.2
  comment_format: []
  # 英文词后接剩余数字（steam42 这类）会挤掉中文候选，默认不生成。
  digit_suffixes: false
