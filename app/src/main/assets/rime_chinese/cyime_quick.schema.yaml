# Rime schema
# encoding: utf-8
#
# 仓颉速成（简易），默认不启用（设置 → 已安装的方案里打开）。
# 码表 cyime_quick.dict.yaml 由 app/build-logic/tasks-cangjie.gradle.kts 从仓颉五代的同一份单字码生成：
# 每个字取仓颉码的首尾两码，字频同仓颉。只有单字，不造词；简繁、字根显示、键盘都与 cyime_cangjie 相同。

schema:
  schema_id: cyime_quick
  name: 仓颉速成
  version: "1.0-cyime1"
  author:
    - 發明人 朱邦復先生
  description: |
    速成（簡易）輸入法：取倉頡碼的首尾兩碼
    碼表由 CyIME 從倉頡五代碼表生成

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  # 1 = 出简体。设置里打开「繁体输出」时按键前改成 0。
  - name: simplification
    reset: 1
    states: [ 繁, 简 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    # 单字提前要在去重之前：它会先取一批候选，放在去重后面，繁简同形的字（傳、传都转成传）会去不掉
    - single_char_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: cyime_quick
  # 速成一个字最多两码；连打时按两码一字切开组句
  enable_sentence: true
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"

simplifier:
  option_name: simplification
  opencc_config: cyime_t2s.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
