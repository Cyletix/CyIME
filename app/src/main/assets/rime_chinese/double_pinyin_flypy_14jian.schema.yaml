# Rime schema
# 小写编码为精确字母，大写代表合并键；逐位派生支持点击与滑动混合输入。
schema:
  schema_id: double_pinyin_flypy_14jian
  name: 小鹤双拼
  version: "1.2"
  language: zh
  input_scheme: double_pinyin
  description: |
    小鹤双拼十四键，与二十六键使用同一份雾凇词库。
    合并键 qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m 由词库消歧。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  # 与 26 键、九键同一套候选规则：长按删掉的候选不再出现（cyime_candidate_policy）。
  filters:
    - cyime_candidate_policy
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaQETUOADGJZCB
  delimiter: " '"
  algebra:
    # 词库里的单个大写字母音节（A–Z，供 26 键直接打出字母）与合并键的大写编码同形，
    # 会被当成完整拼写，使同一输入里的简拼全部被剪掉（zdky 只出 ZDJT）。14 键用不到它们。
    - erase/^[A-Z]$/
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Ⓠ/
    - xform/(.)ei$/$1Ⓦ/
    - xform/uan$/Ⓡ/
    - xform/[uv]e$/Ⓣ/
    - xform/un$/Ⓨ/
    - xform/^sh/Ⓤ/
    - xform/^ch/Ⓘ/
    - xform/^zh/Ⓥ/
    - xform/uo$/Ⓞ/
    - xform/ie$/Ⓟ/
    - xform/(.)i?ong$/$1Ⓢ/
    - xform/ing$|uai$/Ⓚ/
    - xform/(.)ai$/$1Ⓓ/
    - xform/(.)en$/$1Ⓕ/
    - xform/(.)eng$/$1Ⓖ/
    - xform/[iu]ang$/Ⓛ/
    - xform/(.)ang$/$1Ⓗ/
    - xform/ian$/Ⓜ/
    - xform/(.)an$/$1Ⓙ/
    - xform/(.)ou$/$1Ⓩ/
    - xform/[iu]a$/Ⓧ/
    - xform/iao$/Ⓝ/
    - xform/(.)ao$/$1Ⓒ/
    - xform/ui$/Ⓥ/
    - xform/in$/Ⓑ/
    - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/
    # 每一位可独立为精确字母或合并键，不将精确字母重新映射成歧义编码。
    - derive/^(.{0})[qw](.*)$/$1Q$2/
    - derive/^(.{0})[er](.*)$/$1E$2/
    - derive/^(.{0})[ty](.*)$/$1T$2/
    - derive/^(.{0})[ui](.*)$/$1U$2/
    - derive/^(.{0})[op](.*)$/$1O$2/
    - derive/^(.{0})[as](.*)$/$1A$2/
    - derive/^(.{0})[df](.*)$/$1D$2/
    - derive/^(.{0})[gh](.*)$/$1G$2/
    - derive/^(.{0})[jk](.*)$/$1J$2/
    - derive/^(.{0})[zx](.*)$/$1Z$2/
    - derive/^(.{0})[cv](.*)$/$1C$2/
    - derive/^(.{0})[bn](.*)$/$1B$2/
    - derive/^(.{1})[qw](.*)$/$1Q$2/
    - derive/^(.{1})[er](.*)$/$1E$2/
    - derive/^(.{1})[ty](.*)$/$1T$2/
    - derive/^(.{1})[ui](.*)$/$1U$2/
    - derive/^(.{1})[op](.*)$/$1O$2/
    - derive/^(.{1})[as](.*)$/$1A$2/
    - derive/^(.{1})[df](.*)$/$1D$2/
    - derive/^(.{1})[gh](.*)$/$1G$2/
    - derive/^(.{1})[jk](.*)$/$1J$2/
    - derive/^(.{1})[zx](.*)$/$1Z$2/
    - derive/^(.{1})[cv](.*)$/$1C$2/
    - derive/^(.{1})[bn](.*)$/$1B$2/

translator:
  dictionary: rime_ice
  prism: double_pinyin_flypy_14jian
  spelling_hints: 8
  always_show_comments: true
  preedit_format:
    - xlit/QETUOADGJZCB/qetuoadgjzcb/
  # 合并码无法直接反算唯一音节；保留真实双拼编码，候选注释显示词库读音。
  # 不能套用二十六键 preedit_format 将合并代表字母误显示成另一音节。

menu:
  page_size: 5

punctuator:
  import_preset: default
  __include: symbols:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
