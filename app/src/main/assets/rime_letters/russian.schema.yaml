# CyIME 俄语：字母像英文一样逐字直接上屏，补全由应用按商店里的俄语补全词表给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 jcuken_russian 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: russian
  name: 俄语
  version: "1"
  author:
    - Cyletix
  description: |
    俄语 ЙЦУКЕН 键盘；长按 е 出 ё、长按 ь 出 ъ，补全不用打 ё（еще → ещё）。

switches:
  - name: ascii_mode
    states: [ RU, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
