# CyIME 德语：字母像英文一样逐字直接上屏，补全由应用按商店里的德语补全词表给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 qwerty_german 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: german
  name: 德语
  version: "1"
  author:
    - Cyletix
  description: |
    德语 26 键；长按 a o u s 出 ä ö ü ß，补全不用打变音（uber → über）。

switches:
  - name: ascii_mode
    states: [ DE, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
