# CyIME 意大利语：字母像英文一样逐字直接上屏，补全由应用按商店里的意大利语补全词表给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 qwerty_italian 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: italian
  name: 意大利语
  version: "1"
  author:
    - Cyletix
  description: |
    意大利语 26 键；长按元音出 à è é ì ò ù，补全不用打重音（perche → perché）。

switches:
  - name: ascii_mode
    states: [ IT, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
