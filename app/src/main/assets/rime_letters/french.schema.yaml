# CyIME 法语：字母像英文一样逐字直接上屏，补全由应用按商店里的法语补全词表给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 qwerty_french 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: french
  name: 法语
  version: "1"
  author:
    - Cyletix
  description: |
    法语 26 键；长按元音和 c 出 é è ê à ç 等，补全不用打重音（tres → très）。

switches:
  - name: ascii_mode
    states: [ FR, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
