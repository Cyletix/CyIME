# CyIME 西班牙语：字母像英文一样逐字直接上屏，补全和重音由应用按 spanish/words.txt 给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 qwerty_spanish 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: spanish
  name: 西班牙语
  version: "1"
  author:
    - Cyletix
  description: |
    西班牙语 26 键，带 ñ 键；长按元音出 á é í ó ú ü，补全不用打重音（cancion → canción）。

switches:
  - name: ascii_mode
    states: [ ES, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
