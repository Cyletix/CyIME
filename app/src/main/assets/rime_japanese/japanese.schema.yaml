# Xime adaptation: schema ID/name and default input mode changed; conversion by azooKey
# (cyime_azookey_translator). See NOTICE.md.
# Rime schema
# encoding: utf-8
#
# License: Apache License 2.0
# Author: lazy fox chan

# # # # # # # # # # # # # # # # # # # #
# スキーマの基本情報の設定
# # # # # # # # # # # # # # # # # # # #
schema:
  schema_id: japanese
  name: 日语26键
  version: "1.0"
  author:
    - lazy fox chan
  description: |
    日本語ローマ字入力
    ・でも「-」キーだけじゃなくてLキーも伸ばし棒
    ・Shift押しながら入力すると強制カタカナ入力だにょ

# # # # # # # # # # # # # # # # # # # #
# 機能切り替えの設定
# # # # # # # # # # # # # # # # # # # #
switches:
  - name: ascii_mode
    states: [ あ, A ]
    reset: 0  # Xime: start in Japanese mode
  - name: full_shape
    states: [ 半角記号, 全角記号 ]
    reset: 0  # デフォルトで半角記号モード

# # # # # # # # # # # # # # # # # # # #
# 読み込むエンジンの設定
# # # # # # # # # # # # # # # # # # # #
engine:
  processors:
    - ascii_composer
    - lua_processor@*cyime_japanese_romaji
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - cyime_azookey_translator
  filters:
    - uniquifier

# # # # # # # # # # # # # # # # # # # #
# 文字入力の設定
# # # # # # # # # # # # # # # # # # # #
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-"
  initials: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-"
  delimiter: " "

# # # # # # # # # # # # # # # # # # # #
# 変換: azooKey (CyIME)
# Dictionary <user_data_dir>/azookey/dictionary, learning <user_data_dir>/azookey/memory.
# Each candidate carries its kana reading as preedit, so Enter commits the kana.
# Pronounced particles (wa/e/o for は/へ/を) are handled inside the converter.
# # # # # # # # # # # # # # # # # # # #

# # # # # # # # # # # # # # # # # # # #
# 記号入力の設定
# # # # # # # # # # # # # # # # # # # #
punctuator:
  full_shape:
    ' ' : '　'
    '(' : '（'  # Xime phone flick punctuation
    ')' : '）'
    ',' : '、'
    '.' : '。'
    '?' : '？'
    '!' : '！'
    '<' : [ '《', '〈' ]
    '>' : [ '》', '〉' ]
    '/' : [ '・', '…', '，', '／' ]
    '\' : [ '＼', '￥', '￦' ]
    '_' : [ '＿', '－', '～', '——', '➖', '〰' ]
    '[' : [ '「', '【', '〔', '［' ]
    ']' : [ '」', '】', '〕', '］' ]
    '{' : [ '『', '〖', '｛' ]
    '}' : [ '』', '〗', '｝' ]
  half_shape:
    ' ' : '　'  # 半角記号モードでも全角スペースにする
    '(' : '（'  # Xime phone flick punctuation
    ')' : '）'
    ',' : '、'
    '.' : '。'
    '?' : '？'
    '!' : '！'
    '<' : [ '《', '〈', '<' ]
    '>' : [ '》', '〉', '>' ]
    '/' : [ '・', '…', '，', '／' ]
    '\' : [ '\', '￥', '￦' ]
    '_' : [ '_', '－', '～', '——', '➖', '〰' ]
    '[' : [ '「', '【', '〔', '［', '[' ]
    ']' : [ '」', '】', '〕', '］', ']' ]
    '{' : [ '『', '〖', '｛', '{' ]
    '}' : [ '』', '〗', '｝', '}' ]

# # # # # # # # # # # # # # # # # # # #
# キーバインドの設定
# # # # # # # # # # # # # # # # # # # #
key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: minus, send: minus }  # 「ー」入力用
    - { when: has_menu, accept: Return, send: Shift+Return }  # Enterで変換しないで直接確定
    - { when: has_menu, accept: Shift+Return, send: Return }  # Shift + Enterで英字確定

# # # # # # # # # # # # # # # # # # # #
# メールアドレスやURLを入力したときに英字モードに自動切り替え
# # # # # # # # # # # # # # # # # # # #
recognizer:
  import_preset: default
  patterns:
    # Uppercase romaji requests katakana; it must not become an ASCII token.
    uppercase: "(?!)"
