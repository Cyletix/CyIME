# Rime dictionary
# encoding: utf-8
#
# CyIME: the particles は/へ/を are pronounced wa/e/o, so learners type them that way.
# The upstream dictionaries only give their kana spellings (ha/he/wo), so wa never offered は and
# whole-sentence conversion produced 私わ. Loaded as a translator pack by the Japanese schemas.
#
# Weights: the bare particles sit just above the kana entries of the same code (わ/え/お are 80000 in
# jaroomaji.kana_kigou), so they win in sentences and the kana stays second. Higher weights for を
# start to break words (oshiete → をシエテ). Compounds copy the Mozc weight of their ha/he spelling.

---
name: cyime_japanese_particles
version: "1"
sort: by_weight
use_preset_vocabulary: false
