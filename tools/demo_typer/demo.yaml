- name: 手写
  layout: cn26
  text: "## 手写\n\n手写支持中文、日语、英文，还能写 LaTeX 数学公式，写完直接插入 Obsidian。用三星 S Pen 的朋友，能识别下笔的轻重，按住 S Pen 的侧键就是橡皮。日语和英文可以连起来写：\n\n永 　ありがとう Hello\n\n公式直接插入 Obsidian：\n\n $V_{n}(r)=\\frac{\\pi^{n/2}}{\\Gamma(\\frac{n}{2}+1)}r^{n}$\n\n"
  do:
  - <hash> <hash> <space> shouxie <enter> <enter>
  - shouxie zhichi zhongwen <dun> riyu <dun> yingwen <comma> hainengxie <space> en:LaTeX <space> shuxuegongshi <comma> xiewan zhijie charu <space> en:Obsidian <period>
