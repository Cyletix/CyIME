- name: 备注
  layout: cn26
  text: "> [!info] 备注\n> 这篇笔记里的每个字，都是在键盘上一个键一个键打出来的，由脚本模拟手指点按，没有直接粘贴。我认为实机演示是展示一个输入法性能、准确性、易用性最直观的方式，目前很少有人这样做，如有不服可以自己跑一段试试。\n\n---\n\n接下来介绍具体功能特色。\n\n"
  do:
