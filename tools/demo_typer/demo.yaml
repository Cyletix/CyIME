- name: 布局
  layout: cn26
  text: "## 布局\n\n布局切换相当便捷，只需点击左上角，就能切换配置好的布局和方案。\n26 键可以自定义符号、自定义布局，符号有好几种输入方式，空格旁边直接就是逗号句号。九键有拼音九键和笔画九键，用的是词组模型，长句子一口气打完，首选很稳。还有 14 键、小鹤双拼、五笔输入（98 版本），甚至日语假名。不管你习惯哪一种，这里都有。\n这里还内置了我自己设计的键盘布局 Cyletix-10。这个布局的好处很直接：手指移动的距离更短，变化比较小，跨手指的移动也很少，打起来更省力，不过仅限 8 根手指打字。我还用进化算法设计了更多不同的布局候选，后续有机会加入。\n\n"
  do:
  - <hash> <hash> <space> buju <enter> <enter>
  - buju qiehuan xiangdang bianjie <comma> zhixu dianji zuoshangjiao <comma> jiu neng qiehuan peizhi hao de buju he fangan <period> <enter>
  - <2> <6> <space> jian keyi zidingyi fuhao <dun> zidingyi buju <comma> fuhao you haojizhong shurufangshi <comma> kongge pangbian zhijie jiushi douhaojuhao <period>
