  text: "## 发布\n\nCyIME 有两个版本。轻量版安装包小，模型用到的时候再从网上下载；完整版把语音、手写、公式这些模型全部装好，装上不联网就能用。用过旧版的，直接覆盖安装就行。Windows 版还在打磨，Linux 版还在规划中，精力有限，随时咕咕~\n\n"
  do:
  - "<hash> <hash> <space> fabu <enter> <enter>"
  - "en:CyIME <space> youlianggebanben <period> qingliangbananzhuangbao xiao <comma> moxingyongdaodeshihou zaicong wangshang xiazai <semicolon>"
