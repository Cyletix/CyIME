- name: 语音
  layout: cn26
  text: "## 输入方式\n\n不仅仅是打字。\n\n## 语音\n\n语音输入用的是离线模型，CPU 占用超低。两个模型配合：一个边听边打字，你一停下来，另一个把整句话重新矫正一次，顺便把标点加上。键盘还能收成一个小悬浮窗，不会挡住内容。\n\n（下面这段是对着平板说出来的）\n语音输入用的是离线模型 资源占用很低 两个模型二次校正 全程在本地运行\n\n日语也能说：\n\n> 音声入力は日本語にも対応しています\n\n"
  do:
