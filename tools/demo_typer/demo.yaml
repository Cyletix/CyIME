  text: "## 手感和外观\n\n外观美化方面，做了：\n- 线性马达震动\n- 三星键盘那样的按键光效\n- 我自己录制的 Rain75 紫薇轴音效，做了降噪、去回音和响度归一化\n- iOS 主题和玻璃效果一键切换\n\n"
