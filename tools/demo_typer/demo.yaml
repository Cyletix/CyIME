  text: "## 物理键盘\n\n接上实体键盘，这就是最好的物理键盘支持。候选变成一条小浮窗，跟着光标走；打拼音的时候按 Tab 切换候选，方向键、Esc、大写提示都和你在电脑上的习惯一样。按键音效是我用自己的 Rain75 键盘一个一个录的，所有按键的音量都调成一样大。\n\n"
