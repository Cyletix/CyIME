- name: 词库
  layout: cn26
  text: "## 词库\n\n先说最核心的词库。CyIME 用的是我自己训练的 N-gram 模型和长句算法 CyLM，在我自己的测试集上几乎持平了排名第一的搜狗。\n\n同一批 1987 个题目（2026-10-23），搜狗（平板测试）对 CyLM 完整版：\n- 26 键全拼（长句，693 个题目）：89.6 对 90.6，持平\n- 26 键简拼（2-4 字，754 个题目）：54.8 对 **63.0**，**+8.3**\n- 九键（长句，540 个题目）：75.5 对 **81.6**，**+6.2**\n\nCyLM 的数字是电脑上跑的同一套引擎和模型，搜狗是平板测试。\n\n"
  do:
  - <hash> <hash> <space> ciku <enter> <enter>
  - xianshuozuihexindeciku <period> en:CyIME <space> yongdeshiwozijixunliande <space> en:N-gram <space> moxinghechangjusuanfa <space> en:CyLM <comma>
