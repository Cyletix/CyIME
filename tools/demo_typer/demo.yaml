  text: "## 26 键全拼\n\n在保证全拼、简拼的正确率、出字速度和打字性能的前提下，支持了非常多样的输入方式。\n\n我还根据自己之前的 Obsidian 英语词库项目，集成了最近流行的打中文出英文单词的功能：候选旁边直接标着英文释义，打「输入法」就能看到 input method。\n\n"
