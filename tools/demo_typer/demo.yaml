  text: "## 拍照识别\n\n还有拍照识别，对着文字拍一下，文本直接进剪贴板。用的是百度飞桨的 PaddleOCR 模型，同样完全离线，特别感谢百度飞桨和 RapidOCR 项目。\n\n"
