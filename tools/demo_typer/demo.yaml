# CyIME demo note, typed key by key (see demo_typer.py). Text follows the user's script
# (Notebook @Inbox/2026-10-25 233438 整理稿.md).
# A plain token is typed and committed with space; `x~` types without committing; `<key>` presses
# a key (`<key:left>` flicks, `<key:hold>` long-presses); `@name` taps interface elements at a
# human pace; `layout=` switches the coordinate table; `wait:ms|sentence|paragraph`; `glide:`,
# `ink:`, `voice:` as in the script; `drag:a>b` slides from key a onto key b;
# `swipe:key:dx:dy:hold` holds a key, then slides by (dx, dy); `tap:x:y` taps a screen point
# (a later candidate whose place was read off a screenshot); `en:Word_two` types a burst of
# English through the language key ("_" is a space). Every segment starts and ends on Chinese
# 26-key with no composition. `text` is what the segment should leave in the note (checked by `check`).
note: /sdcard/Notebook/@Inbox/CyIME演示.md

pace: {interval: 40, hold: 15, pre_commit: 300, commit: 120, sentence: 400, paragraph: 1200, ui: 500}

voices:
  zh:
    voice: Microsoft Huihui Desktop
    text: 语音输入用的是离线模型，资源占用很低，两个模型二次校正，全程在本地运行。
    lead: 2000
    tail: 3500
  ja:
    voice: Microsoft Haruka Desktop
    text: 音声入力は日本語にも対応しています。
    lead: 2000
    tail: 3000

segments:
- name: 开场
  layout: cn26
  text: "# CyIME：做世界上最好用的开源输入法\n\n今天给大家介绍我做的安卓输入法 CyIME，地表最强输入法。\n\n当今输入法群魔乱舞下的集大成者。我看过很多输入法，有些确实有各自的特色，不过大部分都是纯垃圾，缺陷很大。虽然我们都是站在巨人肩膀上做事，但这些无异于在巨人肩膀上拉屎的 vibe 产物，我实在是吃不下，于是想到为何不自己做一个键盘呢。花了一个月时间做了个键盘，用的是 Rime 引擎，目前只支持 Android。我也做了一个 Windows 版本，不过还需要时间打磨。\n\n我想做出世界上最好用的开源输入法：最好的词库、最好的算法、最好的性能优化、最全面的多模态辅助输入、最好看的主题、音效、震动，最合理的排布，最全面的输入法，以及仅靠离线就能使用所有完整的服务。\n我可以说目前几乎在所有领域都击败了所有对手，或者至少持平，是综合体验最强的输入法。\n\n"
  do:
  # Start from Chinese whatever the keyboard was left on.
  - <hash> <space> en:CyIME <colon> zuoshijieshangzuihaoyong dekaiyuanshurufa <enter> <enter>
  - jintiangeidajiajieshaowo zuodeanzhuoshurufa <space> en:CyIME <comma> dibiaozuiqiangshurufa <period> <enter> <enter>
  - dangjinshurufa qunmoluanwuxiade jidachengzhe <period> wokanguohenduoshurufa <comma> youxiequeshiyougezide tese <comma>
