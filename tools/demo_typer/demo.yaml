- name: 符号
  layout: cn26
  text: "## 符号\n\n常用符号是我精心设计的一套上下角标滑动输入逻辑，符号位置都精心安排过：既保留了电脑上数字键的习惯，又尽可能让同类符号挨在一起，还考虑了只开上角标时的布局。上角标是全角符号，下角标是英文半角，打符号不用切换面板，效率高很多：\n\n> (1+2)*3=9, 50%, #CyIME, @Cyletix, ~/notes/a_b.md\n> 价格：¥99（含税）！\n\n数字键盘还能直接算加减乘除：\n\n> 12+30*2=72\n\n"
