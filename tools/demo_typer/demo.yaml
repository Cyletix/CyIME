- name: 字幕
  layout: cn26
  text: "## 字幕模式\n\n最后，想到长辈年纪增长、听力受损后，整个人交流少了，人也沉默寡言了。我想他的世界什么都听不清，助听器也有各种问题，一定非常孤独和备受折磨。为此，我加入了阿里的 SenseVoice 模型（特别感谢阿里达摩院），配合声纹识别模型，可以分出是谁在说话。打开字幕模式，周围人说的话实时显示成文字，自动分出说话人，可以给每个说话人自定义备注。如果打开了无障碍服务，打电话也能自动开启字幕模式。老人不方便说话、想回复的时候，点一下快捷回复，屏幕就转过来给对面的人看。桌面上还能放一个单独的字幕模式的图标，进入更方便。\n\n每个人说的话各占一栏，声音记住一次，下次自动认出来。聊完可以把记录存成文本，谁、什么时候、说了什么，都在里面。快捷回复里还有【紧急：打 120】，真有急事，老人点一下就能让身边的人看到。\n\n"
  do:
  - <hash> <hash> <space> zimumoshi <enter> <enter>
