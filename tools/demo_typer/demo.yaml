- name: 词库
  layout: cn26
  text: "## 词库\n\n先说最核心的词库。CyIME 用的是我自己训练的 N-gram 模型和长句算法 CyLM，在我自己的测试集上几乎持平了排名第一的搜狗。\n\n同一批 1987 个题目（2026-10-23），搜狗（平板测试）对 CyLM 完整版：\n- 26 键全拼（长句，693 个题目）：89.6 对 90.6，持平\n- 26 键简拼（2-4 字，754 个题目）：54.8 对 **63.0**，**+8.2**\n- 九键（长句，540 个题目）：75.5 对 **81.6**，**+6.1**\n\nCyLM 的数字是电脑上跑的同一套引擎和模型，搜狗是平板测试。\n\n"
  do:
  - "<hash> <hash> <space> ciku <enter> <enter>"
  - "xianshuozuihexindeciku <period> en:CyIME <space> yongdeshiwozijixunliande <space> en:N-gram <space> moxinghechangjusuanfa <space> en:CyLM <comma>"
  - "zai wo ziji de ceshiji shang jihuchipinglepaimingdiyi desougou <period> <enter> <enter>"
  - "tongyipi <space> <1> <9> <8> <7> <space> getimu <lparen> en:2026-10-23 <rparen> <comma> sougou <lparen> pingbanceshi <rparen> dui <space> en:CyLM <space> wanzhengban <colon> <enter>"
  - "en:-_ <2> <6> <space> jian quanpin <lparen> changju <comma> <6> <9> <3> <space> getimu <rparen> <colon> en:89.6 <space> dui <space> en:90.6 <comma> chiping <enter>"
  - "<2> <6> <space> jian jianpin <lparen> en:2-4 <space> zi <comma> <7> <5> <4> <space> getimu <rparen> <colon> en:54.8 <space> dui <space> en:**63.0** <comma> en:**+8.2** <enter>"
  - "jiujian <lparen> changju <comma> <5> <4> <0> <space> getimu <rparen> <colon> en:75.5 <space> dui <space> en:**81.6** <comma> en:**+6.1** <enter> <enter> <enter>"
  - "en:CyLM <space> deshuzishi diannaoshang paodetongyitaoyinqinghe moxing <comma> sougoushi pingban ceshi <period> <enter> <enter>"

- name: 布局
  layout: cn26
  text: "## 布局\n\n布局切换相当便捷，只需点击左上角，就能切换配置好的布局和方案：\n- 26 键可以自定义符号、自定义布局，符号有好几种输入方式，空格旁边直接就是逗号句号。\n- 九键有拼音九键和笔画九键（笔画要自己装），用的是词组模型，长句子一口气打完，首选很稳。\n- 还有 14 键、小鹤双拼、五笔 98，甚至日语假名，不管你用哪一种，这里都有。\n- 这里还内置了我自己设计的键盘布局 Cyletix-10。它的好处很直接：手指移动的距离更短，变化比较小，跨手指的移动也很少，打起来更省力，不过仅限十个手指打字。\n- 我还用进化算法设计了更多不同的布局候选，后续有机会加入。\n\n"
  do:
  - "<hash> <hash> <space> buju <enter> <enter>"
  - "bujuqiehuan xiangdangbianjie <comma> zhixudianji zuoshangjiao <comma> jiunengqiehuan peizhihaodebuju hefangan <colon> <enter>"
  - "en:-_ <2> <6> <space> jian keyi zidingyi fuhao <dun> zidingyi buju <comma> fuhao you haojizhong shurufangshi <comma> kongge pangbian zhijie jiushi douhaojuhao <period> <enter>"
  - "jiujianyoupinyin jiujianhebihua jiujian <lparen> bihuayaoziji zhuang <rparen> <comma> yongdeshicizu moxing <comma> changjuziyikouqi dawan <comma> shouxuanhenwen <period> <enter>"
  - "haiyou <space> <1> <4> <space> jian <dun> xiaoheshuangpin <dun> wubi <space> <9> <8> <comma> shenzhi riyu jiaming <comma> buguan ni yong nayizhong <comma> zheli dou you <period> <enter>"
  - "zheli hai neizhi le wo ziji sheji de jianpan buju <space> en:Cyletix-10 <period> ta de haochu hen zhijie <colon>"
  - "shouzhi yidong de juli gengduan <comma> bianhua bijiao xiao <comma> kuashouzhi de yidong ye henshao <comma> daqilai gengshengli <comma> buguo jinxian shigeshouzhi dazi <period> <enter>"
