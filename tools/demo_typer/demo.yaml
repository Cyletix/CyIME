  - "yiji jin~ wait:300 tap:432:2000 lixianjiuneng shiyongsuoyouwanzhengde fuwu <period> <enter> <enter>"
  - "yushi hualeyigeyueshijianzuole gejianpan <comma> ji~ wait:300 tap:1545:2000 yu~ wait:300 tap:418:2000 <space> en:Xime <lparen> en:Rime <space> yinqing <rparen> <comma> muqianzhizhichi <space> android <period>"
  - "woyezuoleyige <space> windows <space> banben <comma> buguohaixuyaoshijiandamo <period> <enter> <enter>"
