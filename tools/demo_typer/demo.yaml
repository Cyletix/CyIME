- name: 编辑和快捷键
  layout: cn26
  text: "## 编辑和快捷键\n\nCyIME 有一组编辑按钮，常见的文本编辑操作全在里面。即使不打开编辑罗盘，长按空格左右滑动，光标就跟着走，灵敏度是我精心调教过的。\n\n点亮大写键再长按空格拖动就能选中文字。我还给符号键做了功能集成：按住符号键，字母键会换成快捷键，拖到字母上就是 Ctrl 快捷键，让 26 键也能像电脑一样 Ctrl+C、Ctrl+V，比如：\n\n> 把这两个字**加粗**。\n\n"
  do:
  - "<hash> <hash> <space> bianjihekuaijiejian <enter> <enter>"
  - "en:CyIME <space> youyizubianjianniu <comma> changjiandewenbenbianji caozuoquanzailimian <period>"
  - "jishibudakaibianjiluopan <comma> changankongge zuoyouhuadong <comma> guangbiaojiugenzhezou <comma> lingmindushiwo jingxintiaojiao guode <period> <enter> <enter>"
  - "dianliang daxiejian zai changan kongge tuodong jiuneng xuanzhong wenzi <period> wo hai gei fuhaojian zuole gongneng jicheng <colon>"
  - "anzhufuhaojian <comma> zimujianhui huancheng kuaijiejian <comma> tuodaozimushang jiushi <space> en:Ctrl <space> kuaijiejian <comma>"
  - "rang <space> <2> <6> <space> jian yenengxiang diannao yiyang <space> en:Ctrl+C <dun> en:Ctrl+V <comma> biru <colon> <enter> <enter>"
  - "<gt> <space> bazheliangge zi~ wait:150 tap:288:2003 jiacu"
  - "<shift> swipe:space:-26:0:600 drag:sym>b swipe:space:45:0:600 <period> <enter> <enter>"

- name: 更多细节
  layout: cn26
  text: "## 更多细节\n\n- 上屏以后会接着联想下一个词。\n- 无痕模式不学新词、不记剪贴板，进密码框自动开启。\n- 长按候选可以忘掉学到的词，词库里本来有的词回到原来的位置。\n- 候选栏可以左右滑，看后面更多的候选。\n- 新到的短信验证码会直接出现在候选栏。\n\n---\n\n"
  do:
  - "<hash> <hash> <space> gengduoxijie <enter> <enter>"
  - "en:-_ shangpingyihou huijiezhe lianxiang xiayigeci <period> <enter>"
  - "wuhen moshi buxue xinci <dun> buji jiantieban <comma> jinmimakuang zidong kaiqi <period> <enter>"
  - "changanhouxuan keyiwangdiao xuedaodeci <comma> cikulibenlaiyou decihuidao yuanlaideweizhi <period> <enter>"
  - "houxuanlan keyi zuoyou hua <comma> kan houmian gengduo de houxuan <period> <enter>"
  - "xindaodeduanxin yanzhengmahui zhijiechuxianzai houxuanlan <period> <enter> <enter> <enter>"
  - "en:--- <enter> <enter>"

- name: 语音
  layout: cn26
  text: "## 输入方式\n\n不只是打字。\n\n## 语音\n\n语音输入用的是离线模型，CPU 占用超低。两个模型配合：一个边听边出字，你一停顿，另一个把整句话再矫正一次，顺便把标点加上。键盘还能收成一条小悬浮条，不挡住你看内容。\n\n（下面这段是电脑播放的语音，平板现场识别）\n语音输入用的是离线模型，资源占用很低，两个模型二次校正，全程在本地运行。\n\n日语也能说：\n\n> 音声入力は日本語にも対応しています。\n\n"
  do:
  - "<hash> <hash> <space> shurufangshi <enter> <enter> buzhishidazi <period> <enter> <enter>"
  - "<hash> <hash> <space> yuyin <enter> <enter>"
  - "yuyinshuruyongdeshi lixianmoxing <comma> en:CPU <space> zhanyongchaodi <period> lianggemoxingpeihe <colon>"
  - "yige bianting bianchuzi <comma> ni yi tingdun <comma> lingyige bazhengjuhua zai jiaozheng yici <comma> shunbianbabiaodian jiashang <period>"
  - "jianpanhainengshoucheng yitiaoxiao xuanfutiao <comma> budangzhunikan neirong <period> <enter> <enter>"
  - "<lparen> xiamianzheduan shidiannaobofang deyuyin <comma> pingbanxianchang shibie <rparen> <enter>"
  - "voice:zh <enter> <enter> wait:2500"
  - "riyuyenengshuo <colon> <enter> <enter>"
  - "<gt> <space> <lang:hold> @ja voice:ja <enter> <enter> <lang:hold> @zh"

- name: 手写
  layout: cn26
  text: "## 手写\n\n手写支持中文、日语、英文，还能写 LaTeX 数学公式，写完直接插进 Obsidian。用三星 S Pen 的朋友，压感是能检测到的，按住笔侧键就是橡皮。日语和英文可以连着写。\n\n（这一段现场手写）\n\n"
  do:
  - "<hash> <hash> <space> shouxie <enter> <enter>"
  - "shouxie zhichi zhongwen <dun> riyu <dun> yingwen <comma> hainengxie <space> en:LaTeX <space> shuxuegongshi <comma> xiewan zhijie chajin <space> en:Obsidian <period>"
  - "yong sanxing <space> en:S_Pen <space> de pengyou <comma> yagan shi neng jiance dao de <comma> anzhubicejian jiushi xiangpi <period> riyu he yingwen keyi lianzhe xie <period> <enter> <enter>"
  - "<lparen> zheyiduan xianchangshouxie <rparen> <enter> <enter>"

- name: 拍照识别
  layout: cn26
  text: "## 拍照识别\n\n还有拍照识别，对着文字一拍，文本直接进剪贴板。用的是百度飞桨的 PaddleOCR 模型，同样完全离线，在此感谢百度飞桨和 RapidOCR 项目。\n\n"
  do:
  - "<hash> <hash> <space> paizhaoshibie <enter> <enter>"
  - "haiyoupaizhaoshibie <comma> duizhe wenzi yi pai <comma> wenbenzhijiejin jiantieban <period>"
  - "yongdeshibaidufeijiangde <space> en:PaddleOCR <space> moxing <comma> tongyangwanquanlixian <comma> zaici ganxie baidufeijiang he <space> en:RapidOCR <space> xiangmu <period> <enter> <enter>"

