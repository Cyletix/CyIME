- name: 物理键盘
  layout: cn26
  text: "## 物理键盘\n\n接上实体键盘，全网最好的物理键盘支持。候选变成一条小浮窗，跟着光标走；打拼音的时候按 Tab 换候选，方向键、Esc、大写提示都和你在电脑上的习惯一样；Ctrl+空格切换语言，单独按下 Shift 中英互切。按键音效默认使用 Rain75。\n\n"
  do:
  - "<hash> <hash> <space> wulijianpan <enter> <enter>"
  - "jieshangshitijianpan <comma> quanwangzuihaode wulijianpan zhichi <period> houxuanbianchengyitiao xiaofuchuang <comma> genzheguangbiaozou <semicolon>"
  - "dapinyindeshihouan <space> en:Tab <space> huanhouxuan <comma> fangxiangjian <dun> en:Esc <dun> daxietishidouhenizai diannaoshangdexiguan yiyang <semicolon>"
  - "en:Ctrl+ konggeqiehuan yuyan <comma> danduanxia <space> en:Shift <space> zhongyinghuqie <period> anjianyinxiao morenshiyong <space> en:Rain75 <period> <enter> <enter>"

- name: 剪贴板
  layout: cn26
  text: "## 剪贴板\n\n剪贴板会记下复制过的文字和图片，按链接、电话、邮箱等分类，可以固定常用内容，也能把一条记录拆成一个个词挑着上屏；刚截的图会在候选栏提示一键粘贴。和电脑上的 CyIME Windows 配对以后，两边剪贴板自动同步，只在自己的局域网里直传。\n\n"
  do:
  - "<hash> <hash> <space> jiantieban <enter> <enter>"
  - "jiantieban hui jixia fuzhiguo de wenzi he tupian <comma> an lianjie <dun> dianhua <dun> youxiang deng fenlei <comma> keyi guding changyong neirong <comma>"
