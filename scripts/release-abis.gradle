// Release delivery needs ARM64; keep x86_64 only for the emulator acceptance gate.
gradle.beforeProject { p ->
    if (p.path == ':app') p.afterEvaluate {
        p.android.defaultConfig.ndk.abiFilters.clear()
        p.android.splits.abi.reset()
        p.android.splits.abi.include('arm64-v8a', 'x86_64')
        p.android.splits.abi.universalApk = false
    }
}
