// CyIME packager: leave selected built-in assets out of this build only.
// Passed as -PcyimeIgnoreAssets=name1:name2 (file names under app/src/main/assets).
gradle.beforeProject { p ->
    if (p.path != ':app') return
    def names = (p.findProperty('cyimeIgnoreAssets') ?: '').toString().split(':').findAll { it }
    if (!names) return
    p.plugins.withId('com.android.application') {
        p.androidComponents.finalizeDsl { android ->
            names.each { android.androidResources.ignoreAssetsPatterns.add(it) }
        }
    }
}
