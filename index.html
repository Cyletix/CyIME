<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyIME 输入法</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #F6F5FB; --fg: #23252B; --mute: #6B6D7A; --link: #6A4FC9; }
@media (prefers-color-scheme: dark) { :root { --bg: #15161A; --fg: #ECECF1; --mute: #9A9BA8; --link: #A48BF0; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
main { text-align: center; display: grid; gap: 14px; justify-items: center; }
img { width: 72px; height: 72px; }
h1 { margin: 0; font-size: 28px; }
p { margin: 0; color: var(--mute); }
a { color: var(--link); }
</style>
</head>
<body>
<main>
  <img src="favicon.svg" alt="">
  <h1>CyIME</h1>
  <p>官网正在准备中。</p>
  <p>安卓版请到 <a href="https://github.com/Cyletix/CyIME/releases/latest">GitHub Releases</a> 下载。</p>
</main>
</body>
</html>
